services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "${SERVER_PORT:-5090}:${SERVER_PORT:-5090}"
    volumes:
      # 上传文件目录挂载到宿主机，避免容器重建后丢失图片。
      - blog-storage:/app/blog-storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-white_jotter}
      MYSQL_USER: ${BLOG_DB_USERNAME}
      MYSQL_PASSWORD: ${BLOG_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      # 数据库数据必须持久化，生产迁移和备份也应围绕该卷进行。
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    env_file:
      - .env
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${BLOG_REDIS_PASSWORD}\""]
    ports:
      - "6379:6379"
    volumes:
      # 开启 AOF 并持久化 Redis 数据，降低容器重建造成的缓存/计数丢失。
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${BLOG_REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  blog-storage:
  mysql-data:
  redis-data:
