spring:
  application:
    name: demo_bk
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:demo_bk/.env[.properties]
  servlet:
    multipart:
      max-file-size: ${BLOG_UPLOAD_MAX_FILE_SIZE:5MB}
      max-request-size: ${BLOG_UPLOAD_MAX_REQUEST_SIZE:6MB}
  data:
    redis:
      timeout: ${BLOG_REDIS_TIMEOUT:3000ms}
      connect-timeout: ${BLOG_REDIS_CONNECT_TIMEOUT:2000ms}
      lettuce:
        pool:
          # 2核2G生产环境限制 Redis 连接池，避免缓存访问异常时请求堆积。
          max-active: ${BLOG_REDIS_POOL_MAX_ACTIVE:8}
          max-idle: ${BLOG_REDIS_POOL_MAX_IDLE:4}
          min-idle: ${BLOG_REDIS_POOL_MIN_IDLE:1}
          max-wait: ${BLOG_REDIS_POOL_MAX_WAIT:1000ms}

server:
  port: ${SERVER_PORT:5090}

blog:
  scheduling:
    enabled: ${BLOG_SCHEDULING_ENABLED:true}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml

  configuration:
    map-underscore-to-camel-case: true
