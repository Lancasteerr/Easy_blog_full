spring:
  application:
    name: demo_bk
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:demo_bk/.env[.properties]
  servlet:
    multipart:
      max-file-size: ${BLOG_UPLOAD_MAX_FILE_SIZE:5MB}
      max-request-size: ${BLOG_UPLOAD_MAX_REQUEST_SIZE:6MB}
  data:
    redis:
      timeout: ${BLOG_REDIS_TIMEOUT:5000ms}
      lettuce:
        pool:
          max-active: ${BLOG_REDIS_POOL_MAX_ACTIVE:8}
          max-idle: ${BLOG_REDIS_POOL_MAX_IDLE:8}
          min-idle: ${BLOG_REDIS_POOL_MIN_IDLE:0}
          max-wait: ${BLOG_REDIS_POOL_MAX_WAIT:1000ms}

server:
  port: ${SERVER_PORT:5090}

blog:
  scheduling:
    enabled: ${BLOG_SCHEDULING_ENABLED:true}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml

  configuration:
    map-underscore-to-camel-case: true
