spring:
  datasource:
    url: ${BLOG_DB_URL}
    username: ${BLOG_DB_USERNAME}
    password: ${BLOG_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${BLOG_DB_POOL_MAX_SIZE:10}
      minimum-idle: ${BLOG_DB_POOL_MIN_IDLE:2}
      connection-timeout: ${BLOG_DB_CONNECTION_TIMEOUT:30000}
  data:
    redis:
      host: ${BLOG_REDIS_HOST}
      port: ${BLOG_REDIS_PORT:6379}
      database: ${BLOG_REDIS_DATABASE:0}
      password: ${BLOG_REDIS_PASSWORD}

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    whitelabel:
      enabled: false
  forward-headers-strategy: framework

blog:
  jwt:
    secret: ${BLOG_JWT_SECRET}
  cors:
    allowed-origins: ${BLOG_CORS_ALLOWED_ORIGINS}

storage:
  type: ${BLOG_STORAGE_TYPE:LOCAL}
  local:
    root-path: ${BLOG_STORAGE_ROOT:/app/blog-storage}
    domain: ${BLOG_FILE_DOMAIN}

logging:
  level:
    root: INFO
    com.febrie.demo_bk: INFO
