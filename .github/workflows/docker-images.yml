name: Build Docker Images

on:
  push:
    branches:
      - main
    # 仅应用构建上下文及发布相关配置变更触发发布；文档和安全检查独立维护。
    paths:
      - "demo_bk/**"
      - "blog_front/**"
      - ".github/workflows/backend-tests.yml"
      - ".github/workflows/frontend-tests.yml"
      - ".github/workflows/docker-images.yml"
      - ".github/scripts/smoke-images.sh"
      - "!**/*.md"
      - "!demo_bk/docs/**"
      - "!blog_front/docs/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  BACKEND_IMAGE: ghcr.io/lancasteerr/easy-blog-backend
  FRONTEND_IMAGE: ghcr.io/lancasteerr/easy-blog-frontend

jobs:
  # main 仅在这里调用一次后端测试；前端编译由镜像构建完成。
  validate-backend:
    uses: ./.github/workflows/backend-tests.yml

  build-and-push:
    name: Build, smoke test and publish
    needs: [validate-backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: docker-images-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - name: Prepare release reports
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          # 提前记录提交号，后续失败时仍可上传已生成的发布信息。
          mkdir -p release-reports
          printf '%s\n' "$SOURCE_REVISION" > release-reports/source-revision.txt
          echo "Source revision: $SOURCE_REVISION" >> "$GITHUB_STEP_SUMMARY"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 两端各构建一次，先在本地启动验证，再推送同一批镜像。
      - name: Build backend candidate
        uses: docker/build-push-action@v7
        with:
          context: ./demo_bk
          file: ./demo_bk/Dockerfile
          platforms: linux/amd64
          pull: true
          load: true
          provenance: false
          tags: easy-blog-backend:ci
          labels: |
            org.opencontainers.image.source=https://github.com/Lancasteerr/Easy_blog_full
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend candidate
        uses: docker/build-push-action@v7
        with:
          context: ./blog_front
          file: ./blog_front/Dockerfile
          platforms: linux/amd64
          pull: true
          load: true
          provenance: false
          tags: easy-blog-frontend:ci
          labels: |
            org.opencontainers.image.source=https://github.com/Lancasteerr/Easy_blog_full
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Smoke test runtime images
        run: bash .github/scripts/smoke-images.sh

      - name: Login to GHCR after validation
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified candidates
        env:
          SOURCE_REVISION: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # 仅发布已通过启动和 HTTP 冒烟的本地镜像，不因漏洞报告阻断发布。
          for component in backend frontend; do
            if [ "$component" = backend ]; then repository="$BACKEND_IMAGE"; else repository="$FRONTEND_IMAGE"; fi
            docker tag "easy-blog-${component}:ci" "${repository}:sha-${SOURCE_REVISION}"
            docker tag "easy-blog-${component}:ci" "${repository}:prod"
            docker push "${repository}:sha-${SOURCE_REVISION}"
            docker push "${repository}:prod"
            docker image inspect --format '{{json .RepoDigests}}' "${repository}:prod" \
              > "release-reports/${component}-digests.json"
            echo "${component}: $(cat "release-reports/${component}-digests.json")" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Preserve image release info
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-release-info
          path: release-reports/
