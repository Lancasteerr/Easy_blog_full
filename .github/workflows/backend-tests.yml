name: Backend Tests

on:
  workflow_call:
  pull_request:
    paths:
      - "demo_bk/**"
      - ".github/workflows/backend-tests.yml"
      # 文档不影响编译；main 由发布流程统一调用，避免重复测试。
      - "!**/*.md"
      - "!demo_bk/docs/**"

permissions:
  contents: read

jobs:
  test:
    name: Maven verify
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: demo_bk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # CI 与容器使用同一个安全补丁，避免本机旧 Java 的通过结果掩盖运行差异。
      - name: Set up patched Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17.0.21+9"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run backend tests and package
        run: ./mvnw -B -ntp verify

      - name: Preserve backend validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-validation
          path: demo_bk/target/surefire-reports/*.xml
