name: Backend Tests

on:
  pull_request:
    paths:
      - "demo_bk/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches:
      - main
    paths:
      - "demo_bk/**"
      - ".github/workflows/backend-tests.yml"

permissions:
  contents: read

jobs:
  test:
    name: Maven test and Docker build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: demo_bk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run backend tests
        run: ./mvnw -B test

      - name: Build backend Docker image
        run: docker build --tag easy-blog-backend:ci .
